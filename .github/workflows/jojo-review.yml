name: jojo-ai Review

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate kit (registry + context + skills)
        run: |
          chmod +x ./jojo
          ./jojo sync .

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Test CLI (init | detect | run | version)
        run: python -m unittest discover -s tests -v
