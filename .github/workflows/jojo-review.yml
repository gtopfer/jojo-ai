name: jojo-ai Review

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: jojo doctor
        run: python3 ./jojo doctor

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: jojo review
        run: python3 ./jojo review
